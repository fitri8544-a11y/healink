<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEALINK 2.0 | Daftar Pengunjung</title>

<link rel="icon" type="image/png" sizes="192x192" href="assets/healink-icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/healink-icon-512.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080a20">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;background:radial-gradient(circle at 15% 15%,rgba(124,58,237,.24),transparent 30%),radial-gradient(circle at 85% 85%,rgba(6,182,212,.14),transparent 30%),linear-gradient(135deg,#050716,#0c0c2b 50%,#080b22);overflow-x:hidden}
.register-shell{min-height:100vh;display:grid;place-items:center;padding:22px 16px}
.register-card{width:min(100%,520px);padding:25px 30px;border-radius:28px;border:1px solid rgba(151,129,255,.22);background:linear-gradient(145deg,rgba(31,29,78,.88),rgba(12,15,42,.94));box-shadow:0 30px 80px rgba(0,0,0,.46),0 0 60px rgba(124,58,237,.08);backdrop-filter:blur(22px);position:relative;overflow:hidden}
.register-card:before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,#8b5cf6,#22d3ee,transparent)}
.brand{text-align:center;margin-bottom:22px}
.brand-logo{width:76px;height:76px;display:block;margin:0 auto 11px;border-radius:21px;box-shadow:0 0 30px rgba(99,102,241,.35)}
.eyebrow{color:#55d9f5;font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;margin-bottom:7px}
.brand h1{margin:0;font-size:34px;line-height:1;font-weight:900;letter-spacing:-.04em}.brand h1 span{background:linear-gradient(90deg,#c084fc,#818cf8,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:9px 0 0;color:#b9b8d2;font-size:13px}.version-pill{display:inline-flex;align-items:center;gap:7px;margin-top:11px;padding:7px 12px;border-radius:999px;color:#bffbea;background:rgba(16,185,129,.09);border:1px solid rgba(52,211,153,.22);font-size:10px;font-weight:800}
.section-label{margin:0 0 11px;color:#d8d7e7;font-size:12px;font-weight:800}.visitor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.btnJenis{min-height:76px;padding:11px 7px;border-radius:16px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.045);color:#e9e8f5;font-size:13px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:.22s ease;position:relative;overflow:hidden}.visitor-icon{font-size:21px}.btnJenis:hover{transform:translateY(-2px);background:rgba(255,255,255,.075);border-color:rgba(125,211,252,.28)}
.btnActive{transform:translateY(-2px);color:#fff!important;border-color:rgba(103,232,249,.52)!important;background:linear-gradient(135deg,rgba(124,58,237,.45),rgba(14,165,233,.23))!important;box-shadow:0 10px 28px rgba(56,189,248,.1)}
.selected-box{margin:9px 0 12px;text-align:center;transition:.3s ease}.selected-pill{display:inline-flex;gap:6px;align-items:center;padding:7px 12px;border-radius:999px;color:#a7f3d0;background:rgba(16,185,129,.08);border:1px solid rgba(52,211,153,.2);font-size:11px;font-weight:800}
.inputBox{width:100%;padding:13px 15px;margin-bottom:9px;border-radius:15px;color:#f8fafc;background:rgba(5,8,28,.56);border:1px solid rgba(148,163,184,.16);font-size:13px;transition:.22s ease}.inputBox::placeholder{color:#777a98}.inputBox:focus{outline:none;border-color:rgba(103,232,249,.55);box-shadow:0 0 0 3px rgba(34,211,238,.07),0 0 24px rgba(124,58,237,.1);background:rgba(7,10,34,.78)}
#hintText{color:#aaa9c5;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
.btnMain{width:100%;padding:14px 16px;border:0;border-radius:15px;color:#fff;font-size:14px;font-weight:900;cursor:pointer;background:linear-gradient(90deg,#9333ea,#6366f1 50%,#06b6d4);box-shadow:0 13px 32px rgba(99,102,241,.2);transition:.25s ease}.btnMain:hover{transform:translateY(-2px);box-shadow:0 17px 36px rgba(99,102,241,.3)}
.divider{display:flex;align-items:center;gap:12px;margin:17px 0 13px}.divider:before,.divider:after{content:"";height:1px;flex:1;background:rgba(255,255,255,.09)}.divider span{color:#777895;font-size:9px;font-weight:900;letter-spacing:.18em}
.admin-button{width:100%;padding:12px 16px;border-radius:15px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.035);color:#d9d9e8;font-size:12px;font-weight:800;display:flex;justify-content:center;align-items:center;gap:8px;cursor:pointer;transition:.22s}.admin-button:hover{background:rgba(255,255,255,.065);border-color:rgba(167,139,250,.28)}
.admin-info{margin:9px 0 0;text-align:center;color:#6f718e;font-size:9px}.footer{margin-top:17px;padding-top:13px;border-top:1px solid rgba(255,255,255,.065);text-align:center;color:#666985;font-size:9px;line-height:1.65}
.ripple{position:relative;overflow:hidden}.ripple-effect{position:absolute;border-radius:50%;transform:scale(0);animation:rippleEffect 600ms linear;background:rgba(255,255,255,.28);pointer-events:none}@keyframes rippleEffect{to{transform:scale(4);opacity:0}}
@media(max-width:520px){.register-shell{padding:16px 11px}.register-card{padding:22px 16px;border-radius:23px}.brand-logo{width:72px;height:72px;border-radius:18px}.brand h1{font-size:30px}.visitor-grid{gap:7px}.btnJenis{min-height:70px;font-size:12px;padding:9px 5px}}
</style>
</head>
<body>
<main class="register-shell">
<section class="register-card">
<header class="brand">
<img src="assets/healink-icon-192.png" alt="Logo HEALINK 2.0" class="brand-logo">
<div class="eyebrow">Digital Wellbeing Platform</div>
<h1>HEALINK <span>2.0</span></h1>
<p>Ekosistem Kesejahteraan Minda</p>
<div class="version-pill">● Versi Baharu • Sistem Aktif</div>
</header>

<form id="formDaftar">
<p class="section-label">Pilih jenis pengunjung</p>
<div class="visitor-grid">
<button type="button" onclick="selectJenis('Murid')" id="btnMurid" class="btnJenis ripple"><span class="visitor-icon">🎒</span><span>Murid</span></button>
<button type="button" onclick="selectJenis('Guru')" id="btnGuru" class="btnJenis ripple"><span class="visitor-icon">👨‍🏫</span><span>Guru</span></button>
<button type="button" onclick="selectJenis('Pelawat')" id="btnPelawat" class="btnJenis ripple"><span class="visitor-icon">👤</span><span>Pelawat</span></button>
</div>

<div id="jenisBox" class="selected-box opacity-0 scale-95"><span class="selected-pill">✓ Dipilih: <span id="jenisText"></span></span></div>

<div id="inputSection">
<input id="nama" type="text" placeholder="Nama" autocomplete="name" class="inputBox">
<input id="organisasi" type="text" placeholder="Sekolah / Organisasi" class="inputBox">
<div id="kelasBox"><input id="kelas" type="text" placeholder="Kelas (contoh: 5 Bestari)" class="inputBox"></div>
<p id="hintText" class="hidden text-sm mt-2 mb-4 text-center font-semibold tracking-wide px-4 py-2 rounded-xl"></p>
<button type="submit" class="btnMain">✦ Daftar & Teruskan</button>
</div>
</form>

<div class="divider"><span>ATAU</span></div>
<button type="button" onclick="loginAdmin()" class="admin-button"><span>🔐</span><span>Login Admin</span></button>
<p class="admin-info">Akses pentadbir HEALINK</p>

<footer class="footer">© 2026 HEALINK 2.0 • Ekosistem Kesejahteraan Minda<br>Minda Sihat • Potensi Hebat</footer>
</section>
</main>

<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyA9R5jKqeJNvBHD-SIOuseAqyb_x909R3Q",

    authDomain:
    "bimbingankaunselingskkk.firebaseapp.com",

    projectId:
    "bimbingankaunselingskkk"

};


firebase.initializeApp(firebaseConfig);

const db =
firebase.firestore();


/* =====================================================
   GLOBAL
===================================================== */

let jenisDipilih = "";


/* =====================================================
   SELECT JENIS
===================================================== */

function selectJenis(jenis){

    jenisDipilih = jenis;


    /* RESET */

    document
    .querySelectorAll(".btnJenis")
    .forEach(btn => {

        btn.classList.remove(
            "btnActive",
            "bg-green-400",
            "bg-blue-400",
            "bg-yellow-400",
            "text-black"
        );

    });


    /* ================= MURID ================= */

    if(jenis === "Murid"){

        document
        .getElementById("btnMurid")
        .classList.add(
            "btnActive",
            "bg-green-400",
            "text-black"
        );

    }


    /* ================= GURU ================= */

    if(jenis === "Guru"){

        document
        .getElementById("btnGuru")
        .classList.add(
            "btnActive",
            "bg-blue-400"
        );

    }


    /* ================= PELAWAT ================= */

    if(jenis === "Pelawat"){

        document
        .getElementById("btnPelawat")
        .classList.add(
            "btnActive",
            "bg-yellow-400",
            "text-black"
        );

    }


    /* ================= SHOW SELECTED ================= */

    const jenisBox =
    document.getElementById("jenisBox");

    jenisBox.classList.remove(
        "opacity-0",
        "scale-95"
    );

    jenisBox.classList.add(
        "opacity-100",
        "scale-100"
    );


    document
    .getElementById("jenisText")
    .innerText = jenis;


    /* ================= KELAS ================= */

    const kelasBox =
    document.getElementById("kelasBox");

    const kelasInput =
    document.getElementById("kelas");


    if(jenis === "Murid"){

        kelasBox.style.display =
        "block";

    }

    else{

        kelasBox.style.display =
        "none";

        kelasInput.value = "";

    }


    /* ================= PLACEHOLDER ================= */

    const organisasiInput =
    document.getElementById("organisasi");


    if(jenis === "Murid"){

        organisasiInput.placeholder =
        "Nama Sekolah";

    }

    else if(jenis === "Guru"){

        organisasiInput.placeholder =
        "Nama Sekolah";

    }

    else{

        organisasiInput.placeholder =
        "Sekolah / Organisasi";

    }


    /* ================= HINT ================= */

    const hint =
    document.getElementById("hintText");


    hint.classList.remove("hidden");


    if(jenis === "Murid"){

        hint.innerText =
        "🎒 Sila isi nama, sekolah dan kelas.";

    }

    else if(jenis === "Guru"){

        hint.innerText =
        "👨‍🏫 Sila isi nama dan sekolah.";

    }

    else if(jenis === "Pelawat"){

        hint.innerText =
        "👤 Sila isi nama dan sekolah / organisasi.";

    }


    /* ================= SAVE PILIHAN ================= */

    sessionStorage.setItem(
        "jenisDipilih",
        jenis
    );


    /* ================= FOCUS ================= */

    setTimeout(() => {

        document
        .getElementById("nama")
        .focus();

    },150);

}


/* =====================================================
   SUBMIT DAFTAR
===================================================== */

document
.getElementById("formDaftar")
.addEventListener(
"submit",
function(e){

    e.preventDefault();


    const jenis =
    jenisDipilih;


    const nama =
    document
    .getElementById("nama")
    .value
    .trim();


    const organisasi =
    document
    .getElementById("organisasi")
    .value
    .trim();


    const kelas =
    document
    .getElementById("kelas")
    .value
    .trim();


    /* ================= VALIDATION ================= */

    if(!jenis){

        alert(
            "Sila pilih jenis pengunjung."
        );

        return;

    }


    if(!nama){

        alert(
            "Sila isi nama."
        );

        document
        .getElementById("nama")
        .focus();

        return;

    }


    /* ================= MURID ================= */

    if(jenis === "Murid"){

        if(!organisasi){

            alert(
                "Sila isi nama sekolah."
            );

            document
            .getElementById("organisasi")
            .focus();

            return;

        }


        if(!kelas){

            alert(
                "Sila isi kelas."
            );

            document
            .getElementById("kelas")
            .focus();

            return;

        }

    }


    /* ================= GURU / PELAWAT ================= */

    if(
        jenis === "Guru" ||
        jenis === "Pelawat"
    ){

        if(!organisasi){

            alert(
                "Sila isi sekolah / organisasi."
            );

            document
            .getElementById("organisasi")
            .focus();

            return;

        }

    }


    /* =================================================
       SIMPAN SESSION
    ================================================= */

    sessionStorage.setItem(
        "sudahDaftar",
        "yes"
    );

    sessionStorage.setItem(
        "nama",
        nama
    );

    sessionStorage.setItem(
        "jenis",
        jenis
    );

    sessionStorage.setItem(
        "kelas",
        kelas
    );

    sessionStorage.setItem(
        "organisasi",
        organisasi
    );


    /* =================================================
       SIMPAN FIRESTORE
    ================================================= */

    db
    .collection("pengunjung")
    .add({

        jenis:
        jenis,

        nama:
        nama,

        organisasi:
        organisasi,

        kelas:
        kelas || "-",

        masa:
        firebase.firestore
        .FieldValue
        .serverTimestamp()

    })

    .then(() => {

        console.log(
            "✅ Pengunjung berjaya direkodkan"
        );

    })

    .catch(error => {

        console.error(
            "❌ Firestore:",
            error
        );

    });


    /* =================================================
       MASUK HEALINK
    ================================================= */

    window.location.href =
    "healink-v2.html";

});


/* =====================================================
   LOGIN ADMIN
===================================================== */

function loginAdmin(){

    window.location.href =
    "login.html";

}


/* =====================================================
   RIPPLE EFFECT
===================================================== */

document
.querySelectorAll(".ripple")
.forEach(btn => {

    btn.addEventListener(
    "click",
    function(e){

        const rect =
        this.getBoundingClientRect();


        const diameter =
        Math.max(
            this.clientWidth,
            this.clientHeight
        );


        const radius =
        diameter / 2;


        const circle =
        document.createElement("span");


        circle.classList.add(
            "ripple-effect"
        );


        circle.style.width =
        `${diameter}px`;

        circle.style.height =
        `${diameter}px`;


        circle.style.left =
        `${e.clientX - rect.left - radius}px`;

        circle.style.top =
        `${e.clientY - rect.top - radius}px`;


        this.appendChild(circle);


        setTimeout(() => {

            circle.remove();

        },600);

    });

});


/* =====================================================
   LOAD
===================================================== */

window.addEventListener(
"load",
function(){

    const saved =
    sessionStorage.getItem(
        "jenisDipilih"
    );


    if(
        saved === "Murid" ||
        saved === "Guru" ||
        saved === "Pelawat"
    ){

        selectJenis(saved);

    }

});

</script>

</body>
</html>
