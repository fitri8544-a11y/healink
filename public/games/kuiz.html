/* =====================================================
   STATE
===================================================== */

let index =
  0;

let score =
  0;

let quizAnswered =
  false;

let quizResultSaved =
  false;


/* =====================================================
   LOAD QUESTION
===================================================== */

function loadSoalan() {

  quizAnswered =
    false;


  const q =
    soalan[index];


  document
    .getElementById("question")
    .textContent =
      q.q;


  document
    .getElementById("noSoalan")
    .textContent =
      `Soalan ${index + 1}/${soalan.length}`;


  document
    .getElementById("score")
    .textContent =
      score;


  const percent =
    (index / soalan.length) *
    100;


  document
    .getElementById("progressBar")
    .style.width =
      percent + "%";


  const box =
    document.getElementById(
      "answers"
    );


  box.innerHTML =
    "";


  q.answers.forEach(
    ans => {

      const btn =
        document.createElement(
          "button"
        );


      btn.type =
        "button";


      btn.textContent =
        ans.text;


      btn.className =
        "answer-button";


      btn.onclick =
        () => jawab(
          btn,
          ans
        );


      box.appendChild(
        btn
      );

    }
  );

}


/* =====================================================
   ANSWER
===================================================== */

function jawab(
  btn,
  ans
) {

  if(quizAnswered) {
    return;
  }


  quizAnswered =
    true;


  disableAll();


  if(ans.correct) {

    btn.classList.add(
      "answer-correct"
    );

    score++;

  }

  else {

    btn.classList.add(
      "answer-wrong"
    );

  }


  document
    .querySelectorAll(
      "#answers button"
    )
    .forEach(button => {

      const correctAnswer =
        soalan[index]
          .answers
          .find(
            answer =>
              answer.correct
          );


      if(
        correctAnswer &&
        button.textContent ===
        correctAnswer.text
      ) {

        button.classList.add(
          "answer-correct"
        );

      }

    });


  document
    .getElementById("score")
    .textContent =
      score;


  setTimeout(
    () => {

      index++;


      if(
        index <
        soalan.length
      ) {

        loadSoalan();

      }

      else {

        showResult();

      }

    },
    850
  );

}


/* =====================================================
   DISABLE ANSWERS
===================================================== */

function disableAll() {

  document
    .querySelectorAll(
      "#answers button"
    )
    .forEach(
      button => {

        button.disabled =
          true;

      }
    );

}


/* =====================================================
   RESULT
===================================================== */

async function showResult() {

  document
    .getElementById(
      "progressBar"
    )
    .style.width =
      "100%";


  document
    .getElementById(
      "finalScore"
    )
    .textContent =
      `${score} / ${soalan.length}`;


  const percent =
    Math.round(
      (
        score /
        soalan.length
      ) * 100
    );


  let message =
    "";


  if(percent >= 80) {

    message =
      "Tahniah! Anda menunjukkan pemahaman yang sangat baik tentang amalan kesejahteraan diri.";

  }

  else if(percent >= 60) {

    message =
      "Bagus! Teruskan meneroka HEALINK untuk mengukuhkan lagi pengetahuan tentang penjagaan emosi dan kesejahteraan diri.";

  }

  else {

    message =
      "Teruskan belajar. Anda boleh mencuba semula kuiz dan meneroka aktiviti HEALINK untuk memahami topik ini dengan lebih baik.";

  }


  document
    .getElementById(
      "resultMessage"
    )
    .textContent =
      message;


  document
    .getElementById(
      "resultBox"
    )
    .classList.add(
      "show"
    );


  await saveQuizResult(
    percent
  );

}


/* =====================================================
   SAVE QUIZ RESULT
===================================================== */

async function saveQuizResult(
  percent
) {

  if(quizResultSaved) {

    return;

  }


  quizResultSaved =
    true;


  const status =
    document.getElementById(
      "quizSaveStatus"
    );


  if(status) {

    status.textContent =
      "⏳ Menyimpan keputusan...";

  }


  /* =================================================
    HEALINK USER PROFILE
  ================================================= */

  let healinkUser = {};


  try {

    healinkUser =
      JSON.parse(
        sessionStorage.getItem(
          "healinkUser"
        )
      ) || {};

  }
  catch(error) {

    console.error(
      "HEALINK user profile error:",
      error
    );

  }


  /* =================================================
    USER DATA
    Fallback kepada session lama jika diperlukan
  ================================================= */

  const nama =
    healinkUser.nama ||
    sessionStorage.getItem(
      "nama"
    ) ||
    "Pengguna";


  const jenis =
    healinkUser.jenis ||
    sessionStorage.getItem(
      "jenis"
    ) ||
    "";


  const kelas =
    healinkUser.kelas ||
    sessionStorage.getItem(
      "kelas"
    ) ||
    "";


  const organisasi =
    healinkUser.organisasi ||
    sessionStorage.getItem(
      "organisasi"
    ) ||
    "";


  console.log(
    "🧠 KUIZ USER:",
    {
      nama,
      jenis,
      kelas,
      organisasi
    }
  );


  const dataAktiviti = {

    nama:
      nama,

    jenis:
      jenis,

    kelas:
      kelas || "-",

    organisasi:
      organisasi,

    module:
      "Kuiz Minda Sihat",

    aktiviti:
      "Kuiz Pembelajaran",

    skor:
      score,

    jumlahSoalan:
      soalan.length,

    peratus:
      percent,

    komen:
      `${score}/${soalan.length} jawapan betul`,

    perluPerhatian:
      false,

    masa:
      firebase.firestore
        .FieldValue
        .serverTimestamp()

  };


  try {

    await db
      .collection(
        "aktivitiPelajar"
      )
      .add(
        dataAktiviti
      );


    if(status) {

      status.textContent =
        "✓ Keputusan berjaya direkodkan.";

    }


    console.log(
      "🧠 Kuiz result saved:",
      dataAktiviti
    );

  }

  catch(error) {

    quizResultSaved =
      false;


    if(status) {

      status.textContent =
        "⚠ Keputusan belum dapat direkodkan.";

    }


    console.error(
      "Kuiz Firestore error:",
      error
    );

  }

}


/* =====================================================
   RESTART
===================================================== */

function restartGame() {

  index =
    0;

  score =
    0;

  quizAnswered =
    false;

  quizResultSaved =
    false;


  document
    .getElementById(
      "resultBox"
    )
    .classList.remove(
      "show"
    );


  document
    .getElementById(
      "quizSaveStatus"
    )
    .textContent =
      "";


  document
    .getElementById(
      "score"
    )
    .textContent =
      "0";


  loadSoalan();

}


/* =====================================================
   HOME
===================================================== */

function goHome() {

  window.location.href =
    "../healink-v2.html";

}


/* =====================================================
   CHECK HEALINK SESSION
===================================================== */

function checkHealSession() {

  const nama =
    sessionStorage.getItem(
      "nama"
    );


  const profile =
    sessionStorage.getItem(
      "healinkUser"
    );


  if(
    !nama &&
    !profile
  ) {

    console.warn(
      "Tiada sesi pengguna HEALINK."
    );


    window.location.href =
      "../register.html";


    return false;

  }


  return true;

}

/* =====================================================
   START
===================================================== */

if(
  checkHealSession()
) {

  loadSoalan();

}
