# =====================================================
# HEALINK 2.0
# GITHUB ACTIONS - FCM NOTIFICATION
# Authentication: Workload Identity Federation
# =====================================================

name: HEALINK 2.0 Notifications

on:

  # ==========================================
  # AUTOMATIC SCHEDULE - EVERY 15 MINUTES
  # ==========================================
  schedule:
    - cron: "7,22,37,52 * * * *"

  # ==========================================
  # MANUAL WORKFLOW
  # ==========================================
  workflow_dispatch:
    inputs:
      send_notification:
        description: "Aktifkan penghantaran notifikasi sebenar?"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: healink-notifications
  cancel-in-progress: false

jobs:
  check-notifications:
    name: Semak Notifikasi HEALINK
    runs-on: ubuntu-latest

    timeout-minutes: 10

    env:
      # Scheduled: penghantaran notifikasi sebenar
      # Manual: DRY RUN kecuali diaktifkan
      HEALINK_DRY_RUN: ${{ (github.event_name == 'schedule' || inputs.send_notification == true) && 'false' || 'true' }}

    steps:

      # 1. DOWNLOAD PROJECT
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. SETUP NODE.JS
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # 3. INSTALL DEPENDENCIES
      - name: Install Dependencies
        run: npm ci

      # 4. GOOGLE CLOUD AUTHENTICATION
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/847162891153/locations/global/workloadIdentityPools/healink-github-pool/providers/healink-github-provider"
          service_account: "healink-notification-runner@bimbingankaunselingskkk.iam.gserviceaccount.com"
          project_id: "bimbingankaunselingskkk"
          create_credentials_file: true
          export_environment_variables: true

      # 5. RUN NOTIFICATION SCRIPT
      - name: Run HEALINK Notifications
        run: node scripts/send-healink-notifications.js