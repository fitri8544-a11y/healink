# =====================================================
# HEALINK 2.0
# GITHUB ACTIONS - FIREBASE NOTIFICATION DRY RUN
# Authentication: Workload Identity Federation
# =====================================================

name: HEALINK 2.0 Notifications

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check-notifications:
    name: Semak Notifikasi HEALINK
    runs-on: ubuntu-latest

    timeout-minutes: 10

    env:
      HEALINK_DRY_RUN: "true"

    steps:

      # ==========================================
      # 1. DOWNLOAD PROJECT
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. SETUP NODE.JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # ==========================================
      # 3. INSTALL DEPENDENCIES
      # ==========================================
      - name: Install Dependencies
        run: npm ci

      # ==========================================
      # 4. GOOGLE CLOUD AUTHENTICATION
      # ==========================================
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/847162891153/locations/global/workloadIdentityPools/healink-github-pool/providers/healink-github-provider"
          service_account: "healink-notification-runner@bimbingankaunselingskkk.iam.gserviceaccount.com"
          project_id: "bimbingankaunselingskkk"
          create_credentials_file: true
          export_environment_variables: true

      # ==========================================
      # 5. RUN DRY RUN
      # ==========================================
      - name: Run HEALINK Notifications (Dry Run)
        run: node scripts/send-healink-notifications.js